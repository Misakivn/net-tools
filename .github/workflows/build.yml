name: Build NetTools.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cài thư viện
        run: python -m pip install -r requirements-dev.txt

      - name: Kiểm thử
        run: python -m pytest -q

      - name: Tạo icon và thông tin phiên bản
        run: |
          python scripts/make_icon.py
          python scripts/write_version.py

      - name: Đóng gói
        run: python -m PyInstaller --noconfirm --clean NetTools.spec

      - name: Tải file exe lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetTools
          path: dist/NetTools.exe

      - name: Tạo Release khi gắn tag v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NetTools.exe
          generate_release_notes: true
